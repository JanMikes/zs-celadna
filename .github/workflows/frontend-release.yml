# Frontend Release — build the Symfony frontend image and deploy to lily via the
# shared reusable workflow (TheDevs-cz/ci). Replaces the old build +
# appleboy/ssh-action deploy to spare.srv: the box now PULLS, and this repo holds
# no SSH key — only a per-app HMAC secret whose worst-case leak is "re-trigger
# this one app's deploy".
#
# Still gated on `Frontend Tests` (workflow_run + conclusion == success).
#
# ONE HOOK, TWO WORKFLOWS: this and strapi.yml both pass `app: zs-celadna` — on
# lily the two images are one compose project (shared uploads volume). Tag is the
# house default `main`; the box's compose pins both images to ${IMAGE_TAG:-main}.
# See lily.srv D78.
#
# await_deploy is false: no commit-status token for this app on the box, and
# await is fail-closed. Deploy result: Grafana/Loki (app="deploy").

name: Frontend Release

on:
    workflow_run:
        workflows: [Frontend Tests]
        types:
            - completed
        branches:
            - main

permissions:
    contents: read
    packages: write

jobs:
    ship:
        if: ${{ github.event.workflow_run.conclusion == 'success' }}
        uses: TheDevs-cz/ci/.github/workflows/_ship.yml@v1
        secrets:
            # Passed EXPLICITLY: `secrets: inherit` cannot cross repo owners.
            DEPLOY_WEBHOOK_SECRET: ${{ secrets.DEPLOY_WEBHOOK_SECRET }}
        with:
            app: zs-celadna                         # hook id == /srv/<app> == compose project
            image: ghcr.io/janmikes/zs-celadna
            context: ./frontend
            build_args: APP_VERSION=${{ github.event.workflow_run.head_sha }}
            deploy_host: lily.srv.thedevs.cz
            await_deploy: false
