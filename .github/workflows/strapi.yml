# Strapi — build the Strapi CMS image (admin panel baked in, target `prod`) and
# deploy it to lily via the shared reusable workflow (TheDevs-cz/ci). Replaces the
# old build + root-SSH deploy to spare.srv. One hook for both images — see
# frontend-release.yml and lily.srv D78.

name: Strapi

on:
    push:
        branches:
            - main
        paths:
            - 'strapi/**'
            - '.github/workflows/strapi.yml'

permissions:
    contents: read
    packages: write

jobs:
    ship:
        uses: TheDevs-cz/ci/.github/workflows/_ship.yml@v1
        secrets:
            # Passed EXPLICITLY: `secrets: inherit` cannot cross repo owners.
            DEPLOY_WEBHOOK_SECRET: ${{ secrets.DEPLOY_WEBHOOK_SECRET }}
        with:
            app: zs-celadna                         # hook id == /srv/<app> == compose project
            image: ghcr.io/janmikes/zs-celadna-strapi
            context: ./strapi
            target: prod
            deploy_host: lily.srv.thedevs.cz
            await_deploy: false
